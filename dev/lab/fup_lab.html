      out.push('<rect class="pin-hit' + (pend && pend.net === ni && pend.node === n.id && pend.i === 'out' ? ' fwb-pend' : '') + '" data-net="' + ni + '" data-node="' + n.id + '" data-pin="out" x="' + (x + w - 8) + '" y="' + (op.y - 16) + '" width="32" height="32"/>');
    }
    // Wert-Ausgänge (MOVE OUT1, ADD OUT, Aufruf-Ausgänge)
    n.outs.forEach((p, i) => {
      const op = G.oPos(n, i);
      out.push('<line class="n-stub" x1="' + (x + w) + '" y1="' + op.y + '" x2="' + (x + w + 14) + '" y2="' + op.y + '"/>');
      out.push('<text class="n-pinname" x="' + (x + w - 4) + '" y="' + (op.y + 3) + '" text-anchor="end">' + esc(p.n) + '</text>');
      out.push('<g class="fwb-op" data-net="' + ni + '" data-node="' + n.id + '" data-slot="o:' + i + '" data-fk="s:' + ni + ':' + n.id + ':o:' + i + '" tabindex="0" role="button" aria-label="' + esc(slotAria(n, 'o:' + i)) + '">' +
        '<rect class="op-hit" x="' + (x + w + 16) + '" y="' + (op.y - 16) + '" width="' + (OPW - 16) + '" height="32" rx="3"/>' + opText(p.op, x + w + 18, op.y, 'start') + '</g>');
    });
    // Operand / Instanz über der Box
    if(G.hasTop(n)){
      const v = slotValue(n, 'top'), cx = x + w / 2;
      out.push('<g class="fwb-op" data-net="' + ni + '" data-node="' + n.id + '" data-slot="top" data-fk="s:' + ni + ':' + n.id + ':top" tabindex="0" role="button" aria-label="' + esc(slotAria(n, 'top')) + '">' +
        '<rect class="op-hit" x="' + (cx - 64) + '" y="' + (y - TOPH) + '" width="128" height="' + (TOPH - 2) + '" rx="3"/>' +
        (G.TIMERS[n.t] || G.COUNTERS[n.t] ? opText(v, cx, y - 14, 'middle').replace(/op-addr/, 'op-addr') : opText(v, cx, y - 14, 'middle')) + '</g>');
    }
    // Stern: Eingang hinzufügen
    if(['and', 'or', 'xor', 'empty'].includes(n.t) && !readOnly){
      const ly = G.inPos(n, n.ins.length - 1).y;
      out.push('<g class="fwb-starg" data-net="' + ni + '" data-node="' + n.id + '" data-star="1"><rect class="fwb-starhit" x="' + (x + 1) + '" y="' + (ly + 5) + '" width="24" height="22"/><text class="fwb-star" x="' + (x + 6) + '" y="' + (ly + 22) + '">*</text><title>Eingang hinzufügen</title></g>');
    }
    out.push('</g>');
    return out.join('');
  }
  let inWire = {};
  function wirePath(net, w){
    const s = net.nodes.find(n => n.id === w.s), d = net.nodes.find(n => n.id === w.d);
    if(!s || !d) return null;
    const a = G.outPos(s), b = G.inPos(d, w.p);
    const sx = a.x + 14, sy = a.y, dx = b.x - 14, dy = b.y, mx = sx + Math.max(4, Math.min(12, Math.floor((dx - sx) / 2)));
    if(dx >= mx) return { d: 'M' + sx + ' ' + sy + 'H' + mx + 'V' + dy + 'H' + dx, mx, sy };
    const yb = Math.max(s.y + G.size(s).h, d.y + G.size(d).h) + 12;
    return { d: 'M' + sx + ' ' + sy + 'H' + mx + 'V' + yb + 'H' + (dx - 12) + 'V' + dy + 'H' + dx, mx, sy };
  }
  function netSvg(net, ni){
    inWire = {}; net.wires.forEach(w => { (inWire[w.d] = inWire[w.d] || {})[w.p] = w; });
    const vals = flow ? flowVals(ni) : null;
    const errs = new Set(lastCheck.items.filter(x => x.net === ni && x.level === 'error').map(x => x.node));
    if(errMark && errMark.net === ni) errMark.nodes.forEach(id => errs.add(id));
    let maxX = 0, maxY = 0;
    net.nodes.forEach(n => { const s = G.size(n); maxX = Math.max(maxX, n.x + s.w + (n.outs.length ? OPW + 24 : 40)); maxY = Math.max(maxY, n.y + s.h); });
    const W = Math.max(720, maxX + 120), H = Math.max(net.nodes.length ? 120 : 96, maxY + 96);
    const parts = [];
    const srcCount = {}; net.wires.forEach(w => { srcCount[w.s] = (srcCount[w.s] || 0) + 1; });
    const dots = new Set();
    net.wires.forEach((w, wi) => {
      const p = wirePath(net, w); if(!p) return;
      const v = vals ? vals.nodes[w.s] : undefined;
      const fc = v === true ? ' on' : v === false ? ' off' : '';
      const isSel = sel.net === ni && sel.wire === wi;
      parts.push('<path class="w' + fc + (isSel ? ' fwb-sel' : '') + '" d="' + p.d + '"/>');
      parts.push('<path class="w-hit" data-net="' + ni + '" data-wire="' + wi + '" d="' + p.d + '"><title>Verbindung (antippen, dann Entf zum Löschen)</title></path>');
      if(srcCount[w.s] > 1 && !dots.has(w.s)){ dots.add(w.s); parts.push('<circle class="w-dot" cx="' + p.mx + '" cy="' + p.sy + '" r="3.2"/>'); }
    });
    net.nodes.forEach(n => parts.push(drawNode(n, ni, vals, errs)));
    if(!net.nodes.length) parts.push('<text x="24" y="52" fill="#7d8791" style="font-family:system-ui,sans-serif;font-size:13px">Box aus der Leiste hierher ziehen (oder antippen, dann hier tippen).</text>');
    return '<svg class="fwb-svg" data-net="' + ni + '" width="' + Math.round(W * zoom) + '" height="' + Math.round(H * zoom) + '" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Netzwerk ' + (ni + 1) + '">' + parts.join('') + '</svg>';
  }
  function netMsgs(ni){
    const items = lastCheck.items.filter(x => x.net === ni);
    const list = items.slice(0, 4).map(x => '<li class="fwb-' + (x.level === 'error' ? 'err' : 'warn') + '">' + esc(x.msg) + '</li>');
    if(items.length > 4) list.push('<li>… und ' + (items.length - 4) + ' weitere</li>');
    if(errMark && errMark.net === ni && errMark.msg) list.unshift('<li>' + esc(errMark.msg) + '</li>');
    return list.join('');
  }
  function render(){
    if(rawErr){
      netsEl.innerHTML = '<div class="fwb-errbox">Der Text lässt sich nicht als Funktionsplan darstellen: ' + esc(K.words ? K.words(rawErr.message) : rawErr.message) + '</div>';
      return;
    }
    const keep = keepView();
    lastCheck = G.check(prog, { tags: tagNames.length ? tags : null, locals: symbols.filter(s => /^#/.test(s)).map(s => s.slice(1)) });
    const title = opts.title ? '<div class="fwb-blocktitle">' + esc(opts.title) + '</div>' : '';
    netsEl.innerHTML = title + prog.networks.map((net, ni) => {
      const errs = lastCheck.items.filter(x => x.net === ni && x.level === 'error').length + (errMark && errMark.net === ni ? 1 : 0);
      return '<section class="fwb-net' + (net.collapsed ? ' fwb-collapsed' : '') + (sel.net === ni ? ' fwb-netsel' : '') + '" data-net="' + ni + '" aria-label="Netzwerk ' + (ni + 1) + '">' +
        '<div class="fwb-nethead"><button type="button" class="fwb-b" data-act="collapse" data-net="' + ni + '" aria-expanded="' + (!net.collapsed) + '" title="Ein-/ausklappen">' + (net.collapsed ? '▸' : '▾') + '</button>' +
        '<span class="fwb-no">Netzwerk ' + (ni + 1) + ':</span><input type="text" data-k="title" data-net="' + ni + '" value="' + esc(net.title) + '" placeholder="Titel" aria-label="Titel Netzwerk ' + (ni + 1) + '"' + (readOnly ? ' readonly' : '') + '>' +
        (errs ? '<span class="fwb-bad" title="Netzwerk unvollständig oder fehlerhaft" aria-label="' + errs + ' Fehler">⊗</span>' : net.nodes.length ? '<span class="fwb-good" title="Netzwerk vollständig" aria-label="vollständig">✓</span>' : '') +
        (readOnly ? '' : '<button type="button" class="fwb-b" data-act="dupnet" data-net="' + ni + '" title="Netzwerk kopieren (darunter einfügen)" aria-label="Netzwerk ' + (ni + 1) + ' kopieren">⧉</button><button type="button" class="fwb-b" data-act="delnet" data-net="' + ni + '" title="Netzwerk löschen" aria-label="Netzwerk ' + (ni + 1) + ' löschen">🗑</button>') + '</div>' +
        '<textarea class="fwb-comment" data-k="comment" data-net="' + ni + '" rows="1" placeholder="Kommentar" aria-label="Kommentar Netzwerk ' + (ni + 1) + '"' + (readOnly ? ' readonly' : '') + '>' + esc(net.comment) + '</textarea>' +
        '<div class="fwb-canvas" data-net="' + ni + '">' + netSvg(net, ni) + '</div><ul class="fwb-msgs">' + netMsgs(ni) + '</ul></section>' +
        '<div class="fwb-newnet" data-newnet="' + (ni + 1) + '" aria-hidden="true"></div>';
    }).join('') + (readOnly ? '' : '<button type="button" class="fwb-b fwb-addnet" data-act="addnet">＋ Netzwerk</button>');
    restoreView(keep);
    const zv = bar.querySelector('.fwb-zoomv'); if(zv) zv.textContent = Math.round(zoom * 100) + ' %';
    const u = bar.querySelector('[data-act="undo"]'), r = bar.querySelector('[data-act="redo"]'), pa = bar.querySelector('[data-act="paste"]');
    if(u) u.disabled = !hist.length; if(r) r.disabled = !fut.length; if(pa) pa.disabled = !clip;
  }
  function keepView(){
    const a = document.activeElement;
    return { top: netsEl.scrollTop, left: [...netsEl.querySelectorAll('.fwb-canvas')].map(c => c.scrollLeft), fk: a && rootEl.contains(a) && a.dataset ? a.dataset.fk : null, inside: !!(a && netsEl.contains(a)) };
  }
  function restoreView(k){
    netsEl.scrollTop = k.top;
    netsEl.querySelectorAll('.fwb-canvas').forEach((c, i) => { if(k.left[i]) c.scrollLeft = k.left[i]; });
    if(k.fk || k.inside){ const el = k.fk && netsEl.querySelector('[data-fk="' + k.fk + '"]'); if(el) el.focus({ preventScroll: true }); else if(!rootEl.contains(document.activeElement) || document.activeElement === document.body) rootEl.focus({ preventScroll: true }); }
  }
  let edgeNames = null;
  function flowVals(ni){
    if(!flow) return null;
    if(!edgeNames){ try{ edgeNames = G.edgeMap(prog); }catch(e){ edgeNames = {}; } }
    const em = edgeNames;
    return G.evalNet(N(ni), flow, n => { const k = em[n.id]; const v = k && flow[k]; return v && typeof v === 'object' ? !!v.Q : undefined; });
  }
  function focusKey(k){ const el = netsEl.querySelector('[data-fk="' + k + '"]'); if(el) el.focus({ preventScroll: true }); }

  /* ---------- Änderungen ---------- */
  function snapshot(){ return JSON.stringify(prog); }
  function mutate(fn){
    if(readOnly) return;
    const before = snapshot();
    const r = fn();
    if(r === false) return;
    const after = snapshot();
    if(after !== before){ hist.push(before); if(hist.length > 200) hist.shift(); fut = []; errMark = null; flow = null; }
    commit();
  }
  function commit(){ render(); if(opts.onChange) opts.onChange(getValue()); }
  function getValue(){
    if(rawErr) return rawText;
    const body = G.toText(prog);
    return frame ? frame.head + body.replace(/\n$/, '') + frame.foot : body;
  }
  function newNode(ni, t, o, x, y){
    const n = G.makeNode(t, o); n.id = 'n' + (++prog.seq);
    n.x = snap(Math.max(8, x)); n.y = snap(Math.max(G.hasTop(n) ? TOPH : 8, y));
    N(ni).nodes.push(n); return n;
  }
  const isLogicSrc = n => G.hasOut(n);
  function removeNodes(ni, ids){
    const net = N(ni);
    net.wires.filter(w => ids.has(w.s) && !ids.has(w.d)).forEach(w => { const d = nodeOf(ni, w.d); if(d) clearPin(d, w.p); });
    net.wires = net.wires.filter(w => !ids.has(w.s) && !ids.has(w.d));
    net.nodes = net.nodes.filter(n => !ids.has(n.id));
  }
  function clearPin(n, i){ const p = n.ins[i]; p.op = p.k === 'f' && ['move', 'calc', 'call'].includes(n.t) ? null : '?'; }

  /* ---------- Ablegen (aus Leiste/Bibliothek) ---------- */
  function placeNew(ni, spec, x, y){
    const s = parseSpec(spec); if(s.tool){ setStatus('Werkzeug „' + specLabel(spec) + '“ auf einen Anschluss oder eine Box anwenden.', 'warnmsg'); return false; }
    const n = newNode(ni, s.t, s.o, x - G.boxW({ t: s.t }) / 2, y - 14);
    sel = { net: ni, nodes: new Set([n.id]), wire: null };
    setStatus(G.NAME[n.t] + ' eingefügt.');
    return n;
  }
  function applyDrop(spec, tg){
    if(!tg) return false;
    if(tg.kind === 'newnet'){
      const s = parseSpec(spec); if(s.tool){ setStatus('Werkzeuge wirken auf Anschlüsse, nicht auf neue Netzwerke.', 'warnmsg'); return false; }
      prog.networks.splice(tg.idx, 0, G.emptyNet(''));
      placeNew(tg.idx, spec, 24 + OPW + 40, 40 + TOPH);
      return true;
    }
    if(tg.kind === 'canvas') return !!placeNew(tg.net, spec, tg.x, tg.y);
    return dropOn(spec, tg);
  }
  function dropOn(spec, tg){
    const s = parseSpec(spec);
    if(s.tool) return applyTool(s.tool, tg);
    const ni = tg.net;
    if(tg.kind === 'out') return cascadeOut(ni, tg.node, s.t, s.o);
    if(tg.kind === 'wire') return insertOnWire(ni, tg.w, s.t, s.o);
    if(tg.kind === 'in') return feedInput(ni, tg.node, tg.i, s.t, s.o);
    if(tg.kind === 'node'){
      const n = nodeOf(ni, tg.node);
      if(n && n.t === 'empty'){ convertNode(ni, n, s.t, s.o); return true; }
      if(n && G.hasOut(n)) return cascadeOut(ni, n.id, s.t, s.o);
    }
    setStatus('Hier kann „' + specLabel(spec) + '“ nicht abgelegt werden.', 'warnmsg'); return false;
  }

  /* ---------- Verdrahten und Kaskadieren (F2) ---------- */
  const inY = (n, i) => G.inPos(n, i).y - n.y;
  const right = n => n.x + G.boxW(n);
  function chainOf(ni, id){ const gr = G.chains(N(ni)).find(c => c.ids.has(id)); return gr ? gr.nodes : [nodeOf(ni, id)]; }
  function reaches(net, from, to){
    const seen = new Set([from]), q = [from];
    while(q.length){ const x = q.shift(); if(x === to) return true; net.wires.filter(w => w.s === x).forEach(w => { if(!seen.has(w.d)){ seen.add(w.d); q.push(w.d); } }); }
    return false;
  }
  function connect(ni, srcId, dstId, i){
    const net = N(ni), s = nodeOf(ni, srcId), d = nodeOf(ni, dstId);
    if(!s || !d) return false;
    if(!G.hasOut(s)){ setStatus(G.NAME[s.t] + ' hat keinen Ausgang, der weiterverbunden werden kann.', 'warnmsg'); return false; }
    if(srcId === dstId || reaches(net, dstId, srcId)){ setStatus('Diese Verbindung gäbe einen Zyklus (Rückführung) – nicht möglich.', 'warnmsg'); return false; }
    const p = d.ins[i];
    if(!p || p.k === 'v'){ setStatus('Eingang ' + (p ? p.n : '') + ' nimmt nur einen Operanden, keine Verbindung.', 'warnmsg'); return false; }
    net.wires = net.wires.filter(w => !(w.d === dstId && w.p === i));
    p.op = null;
    net.wires.push({ s: srcId, d: dstId, p: i });
    return true;
  }
  const firstB = n => n.ins.length && n.ins[0].k === 'b';
  const gapFor = n => n.ins.length > 1 ? OPW + 24 : 56;
  function cascadeOut(ni, srcId, t, o){
    const net = N(ni), S = nodeOf(ni, srcId);
    if(!S || !G.hasOut(S)){ setStatus('Diese Box hat keinen Ausgang zum Weiterverbinden.', 'warnmsg'); return false; }
    const outs = net.wires.filter(w => w.s === srcId), oy = G.outPos(S).y;
    if(G.SINKS.has(t)){
      const chain = chainOf(ni, srcId);
      const n = newNode(ni, t, o, 0, 0), fi = G.fIndex(n);
      if(!outs.length){ n.x = snap(right(S) + 56); n.y = snap(oy - inY(n, fi)); }
      else {
        const tg = outs.map(w => nodeOf(ni, w.d)).filter(Boolean);
        const bottom = Math.max(...chain.map(x => x.y + G.size(x).h));
        n.x = snap(Math.min(...tg.map(d => d.x))); n.y = snap(bottom + 16 + (G.hasTop(n) ? TOPH : 0));
      }
      n.ins[fi].op = null; connect(ni, srcId, n.id, fi);
      sel = { net: ni, nodes: new Set([n.id]), wire: null };
      setStatus(outs.length ? 'Abzweig: ' + G.NAME[n.t] + ' hängt am selben Ausgang.' : G.NAME[n.t] + ' an den Ausgang gehängt.');
      return true;
    }
    const probe = G.makeNode(t, o);
    if(!firstB(probe)){ setStatus(G.NAME[t] + ' bekommt Operanden, kein Signal – auf die freie Fläche ziehen.', 'warnmsg'); return false; }
    const gap = gapFor(probe), shift = G.boxW(probe) + gap;
    chainOf(ni, srcId).forEach(x => { if(x !== S && x.x > S.x) x.x += shift; });
    const n = newNode(ni, t, o, 0, 0);
    n.x = snap(right(S) + gap); n.y = snap(oy - inY(n, 0));
    outs.forEach(w => { w.s = n.id; });
    connect(ni, srcId, n.id, 0);
    sel = { net: ni, nodes: new Set([n.id]), wire: null };
    setStatus(G.NAME[n.t] + ' kaskadiert: Ausgang → Eingang ' + n.ins[0].n + '.');
    return true;
  }
  function insertOnWire(ni, wi, t, o){
    const net = N(ni), w = net.wires[wi]; if(!w) return false;
    if(G.SINKS.has(t)) return cascadeOut(ni, w.s, t, o);
    const S = nodeOf(ni, w.s), D = nodeOf(ni, w.d);
    const probe = G.makeNode(t, o);
    if(!firstB(probe)){ setStatus(G.NAME[t] + ' bekommt Operanden, kein Signal.', 'warnmsg'); return false; }
    const gap = gapFor(probe), need = G.boxW(probe) + gap + 56;
    if(D.x - right(S) < need){ const sh = snap(need - (D.x - right(S)) + 8); chainOf(ni, S.id).forEach(x => { if(x !== S && x.x > S.x) x.x += sh; }); }
    const n = newNode(ni, t, o, 0, 0);
    n.x = snap(right(S) + gap); n.y = snap(G.outPos(S).y - inY(n, 0));
    w.s = n.id;
    connect(ni, S.id, n.id, 0);
    sel = { net: ni, nodes: new Set([n.id]), wire: null };
    setStatus(G.NAME[n.t] + ' in die Verbindung eingefügt.');
    return true;
  }
  function feedInput(ni, dId, i, t, o){
    const net = N(ni), D = nodeOf(ni, dId), pin = D && D.ins[i];
    if(!pin) return false;
    const probe = G.makeNode(t, o);
    if(G.SINKS.has(t) || !G.hasOut(probe)){ setStatus('Ausgangsboxen (=, S, R, SR …) kommen an einen Ausgang, nicht an einen Eingang.', 'warnmsg'); return false; }
    if(pin.k === 'v'){ setStatus('Eingang ' + pin.n + ' nimmt nur einen Operanden, keine Box.', 'warnmsg'); return false; }
    const wi = net.wires.findIndex(w => w.d === dId && w.p === i);
    if(wi >= 0) return insertOnWire(ni, wi, t, o);
    const n = newNode(ni, t, o, 0, 0);
    n.x = D.x - 56 - G.boxW(n); n.y = G.inPos(D, i).y - (G.outPos(n).y - n.y);
    if(pin.op && pin.op !== '?' && pin.op !== 'TRUE' && firstB(n)) n.ins[0].op = pin.op;
    connect(ni, n.id, dId, i);
    resolveOverlap(ni, n);
    const minX = Math.min(...chainOf(ni, dId).map(x => x.x - (x.ins.length ? OPW : 8)));
    if(minX < 8){ const sh = snap(8 - minX + 8); chainOf(ni, dId).forEach(x => { x.x += sh; }); }
    net.nodes.forEach(x => { x.x = snap(x.x); x.y = snap(Math.max(G.hasTop(x) ? TOPH : 4, x.y)); });
    sel = { net: ni, nodes: new Set([n.id]), wire: null };
    setStatus(G.NAME[n.t] + ' speist Eingang ' + pin.n + '.');
    return true;
  }
  function resolveOverlap(ni, n){
    const hit = () => N(ni).nodes.some(x => x !== n && x.x < n.x + G.boxW(n) + 8 && x.x + G.boxW(x) + 8 > n.x && x.y - (G.hasTop(x) ? TOPH : 0) < n.y + G.size(n).h && x.y + G.size(x).h > n.y - (G.hasTop(n) ? TOPH : 0));
    for(let k = 0; k < 40 && hit(); k++) n.y += GRID;
  }
  function toggleNeg(ni, nodeId, i){
    const n = nodeOf(ni, nodeId), p = n && n.ins[i];
    if(!p) return false;
    if(p.k === 'v' || p.k === 'o'){ setStatus('Nur Bool-Eingänge lassen sich negieren (' + p.n + ' ist ein Wert).', 'warnmsg'); return false; }
    p.neg = !p.neg;
    if(n.t === 'assign') n.ncoil = !n.ncoil;
    setStatus('Eingang ' + p.n + (p.neg ? ' negiert.' : ': Negation entfernt.'));
    return true;
  }
  function addInput(ni, nodeId, at){
    const n = nodeOf(ni, nodeId);
    if(!n || !['and', 'or', 'xor', 'empty'].includes(n.t)){ setStatus('Nur &, >=1, X und leere Boxen bekommen weitere Eingänge.', 'warnmsg'); return false; }
    at = at === undefined || at === null ? n.ins.length : at;
    n.ins.splice(at, 0, { n: '', k: 'b', neg: false, op: '?' }); n.ins.forEach((p, j) => { p.n = 'IN' + (j + 1); });
    N(ni).wires.forEach(w => { if(w.d === n.id && w.p >= at) w.p++; });
    delete n.pdy;
    setStatus('Eingang hinzugefügt (' + n.ins.length + ' Eingänge).');
    return true;
  }
  function removeInput(ni, nodeId, i){
    const n = nodeOf(ni, nodeId);
    if(!n || !['and', 'or', 'xor', 'empty'].includes(n.t) || n.ins.length <= 2){ setStatus('Eine Box braucht mindestens zwei Eingänge.', 'warnmsg'); return false; }

  function ctxItems(tg){

      const i = tg.i, wired = N(ni).wires.some(w => w.d === n.id && w.p === i);

  /* ---------- Komfort (F4): Rückgängig, Kopieren, Zoom ---------- */
  function undo(){
    if(!hist.length){ setStatus('Nichts rückgängig zu machen.'); return; }
    closeInlineEd(false);
    fut.push(snapshot()); prog = JSON.parse(hist.pop());
    sel = { net: Math.min(sel.net, prog.networks.length - 1), nodes: new Set(), wire: null }; pend = null; errMark = null; flow = null;
    commit(); setStatus('Rückgängig gemacht.');
  }
  function redo(){
    if(!fut.length){ setStatus('Nichts zu wiederholen.'); return; }
    closeInlineEd(false);
    hist.push(snapshot()); prog = JSON.parse(fut.pop());
    sel = { net: Math.min(sel.net, prog.networks.length - 1), nodes: new Set(), wire: null }; pend = null; errMark = null; flow = null;
    commit(); setStatus('Wiederholt.');
  }
  function renumber(net){
    const map = {};
    net.nodes.forEach(n => { map[n.id] = 'n' + (++prog.seq); n.id = map[n.id]; });
    net.wires = net.wires.filter(w => map[w.s] && map[w.d]).map(w => ({ s: map[w.s], d: map[w.d], p: w.p }));
    return net;
  }
  function copySel(){
    const net = N(sel.net); if(!net) return;
    if(sel.nodes.size){
      const ids = new Set(sel.nodes);
      clip = { kind:'nodes', nodes: G.clone(net.nodes.filter(n => ids.has(n.id))), wires: G.clone(net.wires.filter(w => ids.has(w.s) && ids.has(w.d))) };
      setStatus(clip.nodes.length + ' Box(en) kopiert – Strg+V fügt ein.');
    } else { clip = { kind:'net', net: G.clone(net) }; setStatus('Netzwerk ' + (sel.net + 1) + ' kopiert – Strg+V fügt es darunter ein.'); }
    render();
  }
  function paste(ni, x, y){
    if(!clip){ setStatus('Zuerst etwas kopieren (Strg+C).', 'warnmsg'); return; }
    ni = Math.max(0, Math.min(ni || 0, prog.networks.length - 1));
    mutate(() => {
      if(clip.kind === 'net'){ prog.networks.splice(ni + 1, 0, renumber(G.clone(clip.net))); sel = { net: ni + 1, nodes: new Set(), wire: null }; setStatus('Netzwerk eingefügt.'); return; }
      const tmp = renumber({ nodes: G.clone(clip.nodes), wires: G.clone(clip.wires) });
      const minX = Math.min(...tmp.nodes.map(n => n.x)), minY = Math.min(...tmp.nodes.map(n => n.y));
      const bottom = N(ni).nodes.reduce((m, n) => Math.max(m, n.y + G.size(n).h), 0);
      tmp.nodes.forEach(n => { n.x = snap(x !== undefined ? x + n.x - minX : n.x); n.y = snap(y !== undefined ? y + n.y - minY : bottom + 24 + TOPH + n.y - minY); });
      N(ni).nodes.push(...tmp.nodes); N(ni).wires.push(...tmp.wires);
      sel = { net: ni, nodes: new Set(tmp.nodes.map(n => n.id)), wire: null };
      setStatus(tmp.nodes.length + ' Box(en) eingefügt.');
    });
  }
  function setZoom(z){
    zoom = Math.max(0.5, Math.min(2, Math.round(z * 100) / 100));
    closeInlineEd(false);
    render();
  }
  netsEl.addEventListener('wheel', e => { if(!e.ctrlKey) return; e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1)); }, { passive: false });
  // Zwei Finger: zoomen (Pinch)
  let pinch = null;
  netsEl.addEventListener('touchstart', e => { if(e.touches.length === 2){ const [a, b] = e.touches; pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), z: zoom }; drag = null; cancelLongPress(); endGhost(); } }, { passive: true });
  netsEl.addEventListener('touchmove', e => {
    if(!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    const [a, b] = e.touches, d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const z = pinch.z * d / Math.max(20, pinch.d);
    if(Math.abs(z - zoom) > 0.04){ zoom = Math.max(0.5, Math.min(2, Math.round(z * 100) / 100)); if(!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }
  }, { passive: false });
  netsEl.addEventListener('touchend', e => { if(e.touches.length < 2) pinch = null; });

  /* ---------- Tastatur ---------- */
  rootEl.addEventListener('keydown', e => {
    if(e.target.closest('input,textarea')) return;
    const mod = e.ctrlKey || e.metaKey;
    if(mod && !readOnly){
      const k = e.key.toLowerCase();
      if(k === 'z' && !e.shiftKey){ e.preventDefault(); undo(); return; }
      if(k === 'y' || (k === 'z' && e.shiftKey)){ e.preventDefault(); redo(); return; }
      if(k === 'c'){ e.preventDefault(); copySel(); return; }
      if(k === 'v'){ e.preventDefault(); paste(sel.net); return; }
      if(k === 'a'){ e.preventDefault(); sel = { net: sel.net, nodes: new Set((N(sel.net) || { nodes: [] }).nodes.map(n => n.id)), wire: null }; render(); return; }
    }
    if(mod && (e.key === '+' || e.key === '=')){ e.preventDefault(); setZoom(zoom * 1.2); return; }
    if(mod && e.key === '-'){ e.preventDefault(); setZoom(zoom / 1.2); return; }
    const fs = e.target.closest && e.target.closest('[data-slot]');
    const fn = !fs && e.target.closest && e.target.closest('g.fwb-node');
    if(!readOnly && fs){
      const ni = +fs.dataset.net, id = fs.dataset.node, sl = fs.dataset.slot;
      if(e.key === 'Enter' || e.key === 'F2' || e.key === ' '){ e.preventDefault(); openOperand(ni, id, sl); return; }
      if(e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && /[\w%#"\-.]/.test(e.key)){ e.preventDefault(); openOperand(ni, id, sl, e.key); return; }
      if(e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); mutate(() => setSlot(ni, id, sl, /^in:/.test(sl) && nodeOf(ni, id).ins[+sl.split(':')[1]].op === null ? null : '?')); focusKey('s:' + ni + ':' + id + ':' + sl); return; }
    }
    if(!readOnly && fn){
      const ni = +fn.dataset.net, id = fn.dataset.node, n = nodeOf(ni, id);
      if(n && (e.key === 'Enter' || e.key === 'F2')){
        e.preventDefault();
        if(n.t === 'empty'){ openType(ni, id); return; }
        const ph = [...fn.querySelectorAll('[data-slot]')].find(x => slotValue(n, x.dataset.slot) === '?');
        const first = ph || fn.querySelector('[data-slot]');
        if(first) openOperand(ni, id, first.dataset.slot); else openType(ni, id);
        return;
      }
      if(n && n.t === 'empty' && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && e.key !== '*'){ e.preventDefault(); openType(ni, id, e.key); return; }
      if(n && e.key === '*'){ e.preventDefault(); mutate(() => addInput(ni, id)); focusKey('n:' + ni + ':' + id); return; }
      if(n && /^Arrow/.test(e.key)){
        e.preventDefault();
        if(sel.net !== ni || !sel.nodes.has(id)) sel = { net: ni, nodes: new Set([id]), wire: null };
        const st = e.shiftKey ? GRID * 4 : GRID, dx = e.key === 'ArrowLeft' ? -st : e.key === 'ArrowRight' ? st : 0, dy = e.key === 'ArrowUp' ? -st : e.key === 'ArrowDown' ? st : 0;
        mutate(() => { [...sel.nodes].forEach(i => { const m = nodeOf(ni, i); if(m){ m.x = Math.max(8, m.x + dx); m.y = Math.max(G.hasTop(m) ? TOPH : 4, m.y + dy); } }); });
        focusKey('n:' + ni + ':' + id);
        return;
      }
      if(n && (e.key === 'Delete' || e.key === 'Backspace')){ e.preventDefault(); if(!sel.nodes.has(id)) sel = { net: ni, nodes: new Set([id]), wire: null }; }
    }
    if(fn) sel.net = +fn.dataset.net;
    if(e.key === 'Escape'){ armed = null; pend = null; updateArmed(); sel.nodes.clear(); sel.wire = null; setStatus(''); render(); return; }
    if(readOnly) return;
    if(e.key === 'Delete' || e.key === 'Backspace'){
      if(sel.wire !== null && sel.wire !== undefined){ e.preventDefault(); mutate(() => { const net = N(sel.net), w = net.wires[sel.wire]; if(w){ const d = nodeOf(sel.net, w.d); net.wires.splice(sel.wire, 1); if(d) clearPin(d, w.p); } sel.wire = null; }); return; }
      if(sel.nodes.size){ e.preventDefault(); const ids = new Set(sel.nodes); mutate(() => { removeNodes(sel.net, ids); sel.nodes.clear(); setStatus(ids.size + ' Box(en) gelöscht.'); }); }
    }
  });

  /* ---------- Schnittstelle ---------- */
  function setValue(text){
    text = String(text || '');
    frame = /^\s*(FUNCTION_BLOCK|FUNCTION|ORGANIZATION_BLOCK)\b/im.test(text) ? K.splitBlock(text) : null;
    const body = frame ? frame.body : text;
    try{ prog = G.fromText(body); rawErr = null; if(!prog.networks.length) prog.networks.push(G.emptyNet('')); }
    catch(e){ rawErr = e; rawText = text; }
    sel = { net: 0, nodes: new Set(), wire: null }; pend = null; flow = null; errMark = null; hist = []; fut = [];
    render();
  }
  const api = {
    isFup: true, isKop: true,
    getValue, setValue,
    get mode(){ return 'graph'; },
    setMode(){},
    graph: () => prog,
    check: () => G.check(prog, { tags: tagNames.length ? tags : null }),
    setErrorLine(line){ api.setErrorMark(line, 1, ''); },
    setErrorMark(line, col, msg){
      errMark = null;
      if(line){
        const info = G.lineInfo(getValue())[line - (frame ? frame.offset : 0)] || G.lineInfo(getValue())[line];
        const ni = info ? Math.min(info.net, prog.networks.length - 1) : 0;
        const m = String(msg || '').replace(/^Netzwerk \d+: /, '');
        const nodes = new Set(), net = N(ni);
        if(net){
          const names = (m.match(/["'„]([^"'“]+)["'“]/g) || []).map(x => x.slice(1, -1).toLowerCase());
          net.nodes.forEach(n => { const ops = [n.opnd, n.inst, n.target].concat(n.ins.map(p => p.op), n.outs.map(p => p.op)).filter(Boolean).map(v => G.baseName(v).toLowerCase()); if(names.some(x => ops.includes(x))) nodes.add(n.id); });
          if(!nodes.size && /keine Variable|Operand|Platzhalter|\?/.test(m)) net.nodes.forEach(n => { if([n.opnd, n.inst].concat(n.ins.map(p => p.op), n.outs.map(p => p.op)).includes('?')) nodes.add(n.id); });
        }
        errMark = { net: ni, msg: m, nodes };
      }
      render();
    },
    showFlow(env){ flow = env || null; edgeNames = null; render(); },
    clearFlow(){ if(flow){ flow = null; render(); } },
    undo, redo, copySel, pasteAt: (ni, x, y) => paste(ni, x, y), setZoom, get zoom(){ return zoom; },
    insertAtCursor(name){
      if(readOnly || !name) return false;
      let c = cur && nodeOf(cur.net, cur.node) ? cur : null;
      if(!c && sel.nodes.size === 1){ const id = [...sel.nodes][0]; const tg = { kind:'node', net: sel.net, node: id }; mutate(() => dropVar(name, tg)); return true; }
      if(!c){ setStatus('Zuerst einen Eingang oder Operanden antippen, dann die Variable wählen.', 'warnmsg'); return false; }
      const tg = /^in:/.test(c.slot) ? { kind:'in', net: c.net, node: c.node, i: +c.slot.split(':')[1] } : { kind:'slot', net: c.net, node: c.node, slot: c.slot };
      mutate(() => dropVar(name, tg));
      pend = null;
      // weiter zum nächsten Platzhalter im selben Netzwerk
      const all = [...netsEl.querySelectorAll('.fwb-canvas[data-net="' + c.net + '"] [data-slot]')];
      const nx = all.find(x => { const nn = nodeOf(c.net, x.dataset.node); return nn && slotValue(nn, x.dataset.slot) === '?'; });
      if(nx){ cur = { net: c.net, node: nx.dataset.node, slot: nx.dataset.slot }; netsEl.querySelectorAll('.fwb-cur').forEach(x => x.classList.remove('fwb-cur')); nx.classList.add('fwb-cur'); }
      return true;
    },
    setSymbols(list){ symbols = list || []; render(); },
    openOperand, openType, bindVarDrag,
    setReadOnly(ro){ readOnly = !!ro; rootEl.classList.toggle('fwb-ro', readOnly); render(); },
    relayout(){}, refresh(){ render(); },
    el: rootEl
  };
  renderBar();
  render();
  return api;
}

root.FUPWorkbench = { create, FAV, LIB };
if(typeof module !== 'undefined' && module.exports) module.exports = root.FUPWorkbench;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==================== FUP-LABOR ==================== */
/* ===== FUP-Labor: Test-Schleuse für die FUP-Werkbank (nicht das Spiel) =====
   Neuer Editor + PLC-Variablen des Stellwerks + „Übersetzen“ + Textansicht + Simulation + 10 echte Aufgaben mit „Prüfen“.
   Daten: window.FUP_LAB = { stage, tasks:[…], tags } (vom Build eingebettet). */
(function(){
'use strict';
const LAB = window.FUP_LAB, SE = window.SCLEngine, K = window.KOP, E = K.wrapEngine(SE);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);
const tags = LAB.tags || {};
window.SPSQ_REPORT_CONTEXT = () => ({ quest:'fup', context:'FUP-Labor ' + LAB.stage + (cur ? ' · ' + cur.id : '') });

// freies Netzwerk: alle PLC-Variablen
const FREE = { id:'frei', title:'Freies Netzwerk', briefing:'Zeichne, was du willst – alle PLC-Variablen des Stellwerks stehen zur Verfügung. „Übersetzen“ zeigt das Textformat, die Simulation läuft mit allen Eingängen.',
  initialVars: Object.fromEntries(Object.keys(tags).map(k => [k, /^bool$/i.test(tags[k].type) ? false : 0])), starterCode:'NETWORK Netzwerk 1\n', free:true };
const TASKS = [FREE].concat(LAB.tasks);
let cur = null, sim = null;

const ed = window.FUPWorkbench.create($('labEditor'), { tags, onChange: txt => { showText(txt); stopSim(); if(cur && cur.free) renderSim(); } });
window.labEditor = ed;

function showText(txt){ $('labText').textContent = txt == null ? ed.getValue() : txt; }
function ioOf(t){
  if(t.free){
    // freies Netzwerk: nur die Variablen, die im Plan vorkommen (geschrieben = Ausgang, sonst Eingang)
    const g = ed.graph(), used = new Set(), written = new Set();
    const nm = v => { const k = Object.keys(tags).find(x => x.toLowerCase() === String(v || '').toLowerCase()); return k; };
    g.networks.forEach(n => n.nodes.forEach(x => {
      x.ins.forEach(p => { const k = nm(p.op); if(k) used.add(k); });
      x.outs.forEach(p => { const k = nm(p.op); if(k) written.add(k); });
      const k = nm(x.opnd); if(k){ if(/^edge/.test(x.t)) used.add(k); else written.add(k); }
    }));
    written.forEach(k => used.delete(k));
    return { ins: [...used], outs: [...written] };
  }
  const ins = new Set(), outs = new Set();
  if(t.timedTestCases) t.timedTestCases.forEach(c => { Object.keys(c.setup || {}).forEach(k => ins.add(k)); c.steps.forEach(s => { Object.keys(s.inputs || {}).forEach(k => ins.add(k)); Object.keys(s.expect || {}).forEach(k => outs.add(k)); }); });
  else (t.testCases || []).forEach(c => { Object.keys(c.setup || {}).forEach(k => ins.add(k)); Object.keys(c.expect || {}).forEach(k => outs.add(k)); });
  outs.forEach(k => ins.delete(k));
  return { ins: [...ins], outs: [...outs] };
}
function pick(id){
  stopSim();
  cur = TASKS.find(t => t.id === id) || FREE;
  $('labTitle').textContent = cur.title + (cur.id === 'frei' ? '' : ' (' + cur.id + ')');
  $('labBrief').innerHTML = cur.briefing || '';
  $('labResult').innerHTML = '';
  ed.setValue(cur.starterCode || 'NETWORK Netzwerk 1\n');
  showText();
  renderTags();
  renderSim();
  $('labRef').hidden = !!cur.free;
}
function renderTags(){
  const q = ($('labTagFilter').value || '').trim().toLowerCase();
  const used = new Set(Object.keys(cur.initialVars || {}).map(k => k.toLowerCase()));
  const rows = Object.keys(tags).map(k => Object.assign({ name: k }, tags[k]))
    .filter(r => !q || r.name.toLowerCase().includes(q) || r.addr.toLowerCase().includes(q) || r.comment.toLowerCase().includes(q))
    .sort((a, b) => (used.has(b.name.toLowerCase()) - used.has(a.name.toLowerCase())) || a.name.localeCompare(b.name));
  $('labTags').innerHTML = rows.map(r => '<tr data-var="' + esc(r.name) + '" class="' + (used.has(r.name.toLowerCase()) ? 'lab-used' : '') + '" tabindex="0" title="Klick: in den gewählten Eingang einsetzen · Ziehen: auf einen Eingang"><td>' + esc(r.name) + '</td><td class="lab-addr">' + esc(r.addr) + '</td><td>' + esc(r.type) + '</td><td class="lab-com">' + esc(r.comment) + '</td></tr>').join('');
}
$('labTagFilter').addEventListener('input', renderTags);
$('labTags').addEventListener('click', e => { const tr = e.target.closest('[data-var]'); if(tr) ed.insertAtCursor(tr.dataset.var); });
$('labTags').addEventListener('keydown', e => { const tr = e.target.closest('[data-var]'); if(tr && e.key === 'Enter'){ e.preventDefault(); ed.insertAtCursor(tr.dataset.var); } });
if(ed.bindVarDrag) ed.bindVarDrag($('labTags'));

function compile(){
  const code = ed.getValue();
  const t = cur.free ? { lang:'kop', initialVars: cur.initialVars } : cur;
  return { code, prog: E.compileSCL(code, t), t };
}
function errBox(e){
  if(e && e.line) ed.setErrorMark(e.line, 1, e.message);
  return '<div class="lab-err">✗ ' + esc(e.message || String(e)) + '</div>';
}
function translate(){
  showText();
  const ch = ed.check();
  let h = ch.items.length ? '<ul class="lab-list">' + ch.items.map(x => '<li class="' + (x.level === 'error' ? 'lab-e' : 'lab-w') + '">Netzwerk ' + (x.net + 1) + ': ' + esc(x.msg) + '</li>').join('') + '</ul>' : '';
  try{ compile(); h = '<div class="lab-ok">✓ Übersetzt – das Textformat ist gültig.</div>' + h; }
  catch(e){ h = errBox(e) + h; }
  $('labResult').innerHTML = h;
}
function check(){
  stopSim();
  if(cur.free){ translate(); return; }
  let r;
  try{
    const c = compile();
    const res = cur.timedTestCases ? SE.runTimedTests(c.prog, cur.initialVars, cur.timedTestCases) : SE.runSinglePassTests(c.prog, cur.initialVars, cur.testCases);
    const used = E.constructsUsed(c.prog), miss = (cur.mustUse || []).filter(m => !used.has(m));
    r = { res, miss };
  }catch(e){ $('labResult').innerHTML = errBox(e); return; }
  const n = r.res.report.length;
  if(r.res.ok && !r.miss.length){ $('labResult').innerHTML = '<div class="lab-ok" id="labPass">✓ Geprüft: alle ' + n + ' Tests bestanden.</div>'; return; }
  let h = '';
  if(!r.res.ok){
    const f = r.res.failedCase, idx = r.res.report.indexOf(f) + 1;
    const checks = f.steps ? f.steps[f.steps.length - 1].checks : f.checks;
    h += '<div class="lab-err">✗ Test ' + idx + ' von ' + n + ' nicht bestanden.</div><ul class="lab-list">' + checks.filter(c => !c.pass).map(c => '<li class="lab-e">' + esc(c.name) + ': erwartet ' + esc(String(c.expected)) + ', ist ' + esc(String(c.actual)) + '</li>').join('') + '</ul>';
  }
  if(r.miss.length) h += '<div class="lab-err">✗ Es fehlt noch: ' + esc(r.miss.join(', ')) + '</div>';
  $('labResult').innerHTML = h;
}
/* ---------- Simulation ---------- */
let simIn = {};
function renderSim(){
  const io = ioOf(cur);
  simIn = {};
  io.ins.forEach(k => { simIn[k] = typeof cur.initialVars[k] === 'number' ? cur.initialVars[k] : false; });
  $('labSimIn').innerHTML = io.ins.map(k => typeof simIn[k] === 'number'
    ? '<label class="lab-num">' + esc(k) + ' <input type="number" data-in="' + esc(k) + '" value="' + simIn[k] + '"></label>'
    : '<button type="button" class="lab-tog" data-in="' + esc(k) + '" aria-pressed="false">' + esc(k) + '</button>').join('') || '<i>keine Eingänge</i>';
  $('labSimOut').innerHTML = io.outs.map(k => '<span class="lab-lamp" data-out="' + esc(k) + '">' + esc(k) + ' <b>–</b></span>').join('') || '<i>keine Ausgänge</i>';
}
$('labSimIn').addEventListener('click', e => { const b = e.target.closest('.lab-tog'); if(!b) return; const k = b.dataset.in; simIn[k] = !simIn[k]; b.classList.toggle('on', simIn[k]); b.setAttribute('aria-pressed', String(simIn[k])); });
$('labSimIn').addEventListener('input', e => { const i = e.target.closest('[data-in]'); if(i){ const v = parseFloat(i.value); if(!isNaN(v)) simIn[i.dataset.in] = v; } });
function startSim(){
  stopSim();
  let c; try{ c = compile(); }catch(e){ $('labResult').innerHTML = errBox(e); return; }
  const rt = SE.createRuntime(c.prog, c.t.initialVars, {});
  let t = 0;
  sim = setInterval(() => {
    let env; try{ env = rt.scan(0.1, simIn); }catch(e){ stopSim(); $('labResult').innerHTML = errBox(e); return; }
    t += 0.1;
    ed.showFlow(env);
    document.querySelectorAll('#labSimOut [data-out]').forEach(s => { const v = env[s.dataset.out]; s.querySelector('b').textContent = v === true ? '1' : v === false ? '0' : String(v); s.classList.toggle('on', v === true); });
    $('labSimT').textContent = 't = ' + t.toFixed(1) + ' s';
  }, 100);
  $('labSim').textContent = '■ Stopp'; $('labSim').classList.add('on');
}
function stopSim(){ if(sim){ clearInterval(sim); sim = null; ed.clearFlow(); } $('labSim').textContent = '▶ Simulation'; $('labSim').classList.remove('on'); }
$('labSim').addEventListener('click', () => sim ? stopSim() : startSim());
$('labTranslate').addEventListener('click', translate);
$('labCheck').addEventListener('click', check);
$('labRef').addEventListener('click', () => { ed.setValue(cur.refSolution); showText(); $('labResult').innerHTML = '<div class="lab-w">Musterlösung geladen (zum Vergleich).</div>'; });
$('labReset').addEventListener('click', () => pick(cur.id));
$('labTask').innerHTML = TASKS.map(t => '<option value="' + esc(t.id) + '">' + esc(t.free ? t.title : 'Kapitel ' + t.level + ': ' + t.title) + '</option>').join('');
$('labTask').addEventListener('change', e => pick(e.target.value));
$('labStage').textContent = LAB.stage;
pick((new URLSearchParams(location.search).get('task')) || 'frei');
if(location.search.includes('task=')) $('labTask').value = cur.id;
})();

</script>
</body>
